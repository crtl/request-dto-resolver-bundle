name: CI

on:
    pull_request:
      branches:
        - master
        - develop
        - "*.x"
    push:
      branches:
        - master
        - develop
        - feature/refactor
        - "*.x"
    schedule:
        - cron: "0 0 1,16 * *"

jobs:
    test:
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                php: [8.2, 8.3, 8.4]
                symfony: ["7.2", "7.3", "7.4", "8.0"]
                deps: ["normal"]
                exclude:
                    - php: 8.2
                      symfony: "8.0"
                    - php: 8.3
                      symfony: "8.0"

        steps:
            - uses: actions/checkout@v4

            - name: Setup PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: ${{ matrix.php }}
                  tools: composer:v2
                  coverage: xdebug

            - name: Get Composer cache dir
              id: composercache
              run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

            - name: Cache Composer
              uses: actions/cache@v4
              with:
                  path: ${{ steps.composercache.outputs.dir }}
                  key: ${{ runner.os }}-composer-${{ matrix.php }}-${{ matrix.symfony }}-${{ hashFiles('**/composer.json') }}
                  restore-keys: |
                      ${{ runner.os }}-composer-${{ matrix.php }}-${{ matrix.symfony }}-
                      ${{ runner.os }}-composer-${{ matrix.php }}-

            - name: Select Symfony version
              run: |
                composer require \
                  symfony/http-kernel:${{ matrix.symfony }}.* \
                  symfony/dependency-injection:${{ matrix.symfony }}.* \
                  symfony/validator:${{ matrix.symfony }}.* \
                  symfony/framework-bundle:${{ matrix.symfony }}.* \
                  --no-update --no-interaction

            - name: Install deps (normal)
              if: matrix.deps == 'normal'
              run: composer update --no-interaction --prefer-dist --prefer-stable

            - name: Install deps (lowest)
              if: matrix.deps == 'lowest'
              run: composer update --no-interaction --prefer-dist --prefer-lowest --prefer-stable

            - name: PHPUnit Tests
              run: |
                vendor/bin/phpunit \
                --configuration phpunit.xml.dist \
                --log-junit=junit-${{ matrix.php }}-${{ matrix.symfony }}.xml \
                --coverage-clover=coverage-${{ matrix.php }}-${{ matrix.symfony }}.xml \
                $PHPUNIT_ARGS
            - uses: actions/upload-artifact@v6
              with:
                name: phpunit-${{ matrix.php }}-${{ matrix.symfony }}-${{ matrix.deps }}
                path: |
                  coverage*.xml
                  junit*.xml
                if-no-files-found: error
                retention-days: 2

    codecov:
      name: Codecov
      runs-on: ubuntu-22.04

      needs: test                         # <- fixed: wait for test matrix to finish
      timeout-minutes: 15                 # increased timeout

      # Avoid errors on push events; skip Dependabot if desired
      if: github.actor != 'dependabot[bot]'

      steps:
        - name: Checkout
          uses: actions/checkout@v4
          with:
            fetch-depth: 2

        - name: Download artifacts (all test matrix artifacts)
          uses: actions/download-artifact@v7
          # by default will download all artifacts; optionally set `path:` to control location

        - name: Upload test results to Codecov (JUnit)
          uses: codecov/test-results-action@v1
          env:
            CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

        - name: Upload code coverage to Codecov
          uses: codecov/codecov-action@v5
          with:
            fail_ci_if_error: true
          env:
            CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

    phpstan:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - uses: shivammathur/setup-php@v2
              with:
                  php-version: 8.2
                  tools: composer:v2
                  coverage: none

            - name: Install deps
              run: composer install --no-interaction --prefer-dist --no-progress --optimize-autoloader

            - name: Run PHPStan
              run: composer run phpstan

    php-cs-fixer:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - uses: shivammathur/setup-php@v2
              with:
                  php-version: 8.2
                  tools: composer:v2
                  coverage: none

            - name: Install deps
              run: composer install --no-interaction --prefer-dist --no-progress --optimize-autoloader

            - name: Run php-cs-fixer
              run: vendor/bin/php-cs-fixer fix --dry-run --diff
